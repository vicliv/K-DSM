[project]
name = "k-dsm"
version = "0.1.0"
description = "Kurtosis-based Denoising Score Matching (K-DSM) for Anomaly Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "adbench==0.1.11",
    "einops>=0.6.1",
    "fsspec[http]>=2026.1.0",
    "matplotlib>=3.5.0",
    "numpy>=1.23.5",
    "pandas>=2.0.3",
    "pillow>=9.0.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.9.0",
    "tensorflow==2.12.0",
    "torch>=1.13.0",
    "torch-geometric==2.3.1",
    "torchvision>=0.14.1",
    "tqdm>=4.66.0",
    "transformers>=4.41.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools]
py-modules = ["models"]

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = ["baselines*", "methods*", "utils*"]
